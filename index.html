<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Taiwan Real-Time Weather Dashboard</title>
  <!-- Use stlite to run Streamlit completely in the browser via WebAssembly (Pyodide) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
</head>

<body>
  <div id="root" style="width: 100vw; height: 100vh;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
  <script>
    fetch("app.py")
      .then(response => {
        if (!response.ok) throw new Error("Could not fetch app.py");
        return response.text();
      })
      .then(code => {
        stlite.mount(
          {
            requirements: ["pandas", "folium", "streamlit-folium", "plotly"],
            entrypoint: "streamlit_app.py",
            files: {
              "streamlit_app.py": code
            }
          },
          document.getElementById("root")
        );
      })
      .catch(error => {
        document.getElementById("root").innerHTML = "<h2 style='color:red; text-align:center; margin-top:20px;'>Failed to load app.py resource. Check Vercel deployment.</h2>";
        console.error(error);
      });
  </script>
</body>

</html>
